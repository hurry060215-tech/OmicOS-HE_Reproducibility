[project]
name = "omicos-he-reproducibility"
version = "1.0.0"
description = "Reproducibility package for OmicOS H&E Fig. 5 panels and supplementary H&E analyses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [
    { name = "OmicVerse contributors" },
]
keywords = ["omics", "histopathology", "spatial-transcriptomics", "reproducibility", "omicos"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "License :: Free for non-commercial use",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2",
    "matplotlib>=3.7",
    "pillow>=10",
    "nbformat>=5.9",
    "nbclient>=0.9",
    "ipykernel>=6",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "PyMuPDF>=1.23",
    "tifffile>=2024.0",
]

[project.optional-dependencies]
full = [
    "adjustText>=1.0",
    "anndata>=0.10",
    "scanpy>=1.9",
    "openslide-python>=1.3",
    "omicverse>=1.6",
]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/omicverse/OmicOS-HE_Reproducibility"
OmicOS = "https://github.com/omicverse/omicos"
OmicVerse = "https://github.com/omicverse/omicverse"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
